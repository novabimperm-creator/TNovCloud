# Server stack: nginx is the only published service.
# PostgreSQL and the API stay on the internal tnovcloud network.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tnovcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tnovcloud}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tnovcloud

  api:
    build:
      context: .
      dockerfile: src/TNovCloud.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=${POSTGRES_DB:-tnovcloud};Username=${POSTGRES_USER:-tnovcloud};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env}
      Jwt__Issuer: TNovCloud
      Jwt__Audience: TNovCloud
      Storage__Root: /data
      ASPNETCORE_URLS: http://0.0.0.0:8080
    volumes:
      - files:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - tnovcloud

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tnovcloud

networks:
  tnovcloud:
    name: tnovcloud
    driver: bridge

volumes:
  pgdata:
  files:
